<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#05070c">
  <meta name="robots" content="noindex, nofollow">
  <title>404 - Page Not Found | VAR-7QX</title>

  <link rel="icon" type="image/png" href="/var7qx-logo-assets/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(78,242,210,.09), transparent 48%),
        radial-gradient(ellipse at 85% 15%, rgba(96,165,250,.07), transparent 40%),
        #05070c;
      color: #f1f5f9;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 400;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 620px;
    }

    .logo {
      width: min(190px, 55%);
      height: auto;
      object-fit: contain;
      margin-bottom: 52px;
    }

    .status {
      color: #4ef2d2;
      font: 400 11px 'JetBrains Mono', monospace;
      letter-spacing: 2px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font: 600 clamp(100px, 24vw, 180px)/.95 'Space Grotesk', sans-serif;
      letter-spacing: -6px;
      background: linear-gradient(135deg, #f1f5f9 20%, #4ef2d2 75%, #60a5fa);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    h2 {
      margin: 30px 0 12px;
      font: 600 clamp(21px, 5vw, 27px) 'Space Grotesk', sans-serif;
    }

    p {
      max-width: 420px;
      margin: 0 auto;
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.8;
    }

    .home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 34px;
      padding: 14px 24px;
      border: 1px solid rgba(78,242,210,.4);
      border-radius: 8px;
      background: rgba(78,242,210,.08);
      color: #4ef2d2;
      font: 500 13px 'Inter', sans-serif;
      text-decoration: none;
      transition: background .25s ease, transform .25s ease;
    }

    .home:hover {
      background: rgba(78,242,210,.16);
      transform: translateY(-2px);
    }

    .home:focus-visible {
      outline: 2px solid #4ef2d2;
      outline-offset: 4px;
    }

    .footer {
      margin-top: 70px;
      color: #64748b;
      font: 400 10px 'JetBrains Mono', monospace;
      letter-spacing: 1.5px;
    }

    @media (max-width: 480px) {
      .logo { margin-bottom: 42px; }
      h1 { letter-spacing: -6px; }
      .footer { margin-top: 55px; }
    }
  </style>
</head>

<body>
  <main class="container">
    <a href="/" aria-label="VAR-7QX Homepage">
      <img class="logo"
        src="/var7qx-logo-assets/var7qx-logo-full.png"
        alt="VAR-7QX">
    </a>

    <div class="status">ERROR RESPONSE // 404</div>

    <h1>404</h1>

    <h2>Page Not Found</h2>

    <p>
      The page you are looking for doesn't exist or may have been moved.
      Let's get you back to the right place.
    </p>

    <a class="home" href="/">Back to Homepage &rarr;</a>

    <div class="footer">VAR-7QX &bull; ASWIN SANTHOSH</div>
  </main>
</body>
</html>
